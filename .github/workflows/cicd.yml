# This is name of the workflow that will be displayed in the Actions tab
name: CICD

# Manual click delicer workflow
on: 
  workflow_dispatch: 
    inputs:
      environment:
        description: This is the workflow where this workflow runs
        default: 'dev'
        required: true
        type: choice
        options:
          - dev
          - prod
          - staging

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      run: echo "Clone Code from Github"
      
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: build docker container
        run: echo "Docker container Build"
  
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing container"

  deploy:
    if: inputs.environment == 'dev'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the app
        run: echo "Docker compose Deployed the app"
