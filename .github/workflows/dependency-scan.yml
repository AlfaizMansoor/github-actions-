name: dependecy scan

on:
  workflow_call:

jobs:
    dependency-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: pip install --no-cache-dir pip-audit

            - name: Run dependency check
              run: pip-audit -r requirements.txt